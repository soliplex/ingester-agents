# A source on an installation whose download store is object storage.
#
# Where documents go is chosen per installation, not per manifest: set
#   DOWNLOAD_S3_BUCKET=s3://my-documents/ingester
#   DOWNLOAD_DIR=downloads
# and every source's documents land at
#   s3://my-documents/ingester/downloads/<source>/
# (see "Object Storage" in the README). Nothing in this file selects the store.
#
# What a manifest does choose is the haiku-rag config its load uses. An S3
# install needs one whose source stanza is `type: s3`, either for every
# manifest via HAIKU_DEFAULT_CONFIG=haiku.rag.s3.yaml, or per manifest with
# `haiku_config`, as below.
id: s3-download-store
name: S3 Download Store
source: s3-docs

config:
  # Absolute paths are used as-is; a bare filename resolves under HAIKU_PATH.
  haiku_config: haiku.rag.s3.yaml

components:
  - name: docs
    type: webdav
    url: https://webdav.example.com
    path: /documents
