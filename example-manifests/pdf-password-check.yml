# Skip password-protected and unreadable PDFs before they are stored.
#
# Pre-process steps only run when listed; a manifest without `pre_process`
# stores every document as fetched. See the README's "Pre-process steps".
#
# Inspect what was skipped, and retry after changing the step:
#   si-agent manifest pre-process-report example-manifests/pdf-password-check.yml --status skip
#   si-agent manifest reprocess example-manifests/pdf-password-check.yml --status skip
id: pdf-password-check
name: PDF password check
source: pdf-docs
config:
  pre_process:
    - method: soliplex.agents.manifest.pre_processors:check_pdf_password
      mime_types: [application/pdf]
      kwargs:
        skip_invalid: true            # also skip truncated / non-PDF files
        skip_owner_restricted: false  # keep PDFs readable without a password
components:
  - name: shared-pdfs
    type: fs
    path: tests/test_fs
