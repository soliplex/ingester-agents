id: webdav-docs
name: WebDAV Documents
source: webdav-source
config:
  extensions:
    - md
    - pdf
    - docx
components:
  # Scan an entire WebDAV directory recursively
  - name: shared-drive
    type: webdav
    url: https://webdav.example.com
    path: /documents
    # Optional: globs (relative to `path`) skipped without listing, e.g. a
    # folder the account may never read. Their documents are absent on
    # purpose, so stale removal deletes them.
    exclude_paths:
      - HR
      - "**/Private"

  # Ingest a specific list of files
  - name: curated-files
    type: webdav
    url: https://webdav.example.com
    urls:
      - /reports/q1.pdf
      - /reports/q2.pdf

  # Load the URL list from a local file
  - name: from-local-file
    type: webdav
    url: https://webdav.example.com
    urls_file: url-list.txt

  # Load the URL list from S3
  - name: from-s3-file
    type: webdav
    url: https://webdav.example.com
    urls_file: s3://my-bucket/manifests/urls.txt

  # Load the URL list from the same WebDAV server
  - name: from-webdav-file
    type: webdav
    url: https://webdav.example.com
    urls_file: https://webdav.example.com/manifests/urls.txt
    # An empty list is an error, not "delete everything"
    error_on_empty: true
